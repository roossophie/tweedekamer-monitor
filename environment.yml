name: tweedekamer_monitor
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - ipykernel
  - ipython
  - jupyterlab
  - matplotlib
  - pandas
  - pip:
    - dlt[duckdb]
    - duckdb<2  # erpl_odata is not available for DuckDB 2.x yet
    - dbt-duckdb
    - nbstripout
    - requests
    - xmlschema
    - lxml
    - streamlit
